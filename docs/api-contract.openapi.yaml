openapi: "3.1.0"
info:
  title: "Club Informatique de l’IST : contrat d’API"
  version: "1.0.0"
  description: |
    Contrat de référence entre le frontend et le backend.

    Conventions : dates en ISO 8601 UTC ; pagination uniforme (« content », « page », « size », « totalElements », « totalPages ») ;
    erreurs au format RFC 9457 avec un code stable et des messages en français ; identifiants numériques stables.
    Le jeton d’accès est transmis par l’en-tête « Authorization » ; le jeton de rafraîchissement par un cookie HttpOnly.
    L’extension « x-roles » liste les rôles autorisés ; un Formateur et un Responsable du Club héritent des droits du Membre, un Super Admin de ceux de l’Administrateur.
    Les droits sont appliqués par le serveur, par rôle et par propriété de la ressource.
servers:
  - url: /api/v1
tags:
  - name: Authentification
  - name: Compte
  - name: Contenus publics
  - name: Espace Membre
  - name: Notifications
  - name: Formation
  - name: Projets
  - name: Gestion du club
  - name: Administration
  - name: Système et conformité
  - name: Fichiers
security:
  - jetonAcces: []
paths:
  "/auth/register":
    post:
      tags: [Authentification]
      summary: Créer un compte et envoyer le courriel de vérification. Réponse identique que l’adresse existe ou non. 403 (INSCRIPTIONS_FERMEES) si le Super Admin a fermé les inscriptions.
      operationId: postAuthRegister
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/InscriptionCompte"
      responses:
        "201":
          description: Ressource créée.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Erreur400"
        "403":
          $ref: "#/components/responses/Erreur403"
        "429":
          $ref: "#/components/responses/Erreur429"
  "/auth/verification":
    post:
      tags: [Authentification]
      summary: Activer le compte à partir du jeton reçu par courriel (usage unique).
      operationId: postAuthVerification
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/JetonVerification"
      responses:
        "204":
          description: Opération réalisée, sans contenu.
        "400":
          $ref: "#/components/responses/Erreur400"
  "/auth/login":
    post:
      tags: [Authentification]
      summary: Ouvrir une session ; pose le cookie de rafraîchissement HttpOnly. 401 identique pour un compte inconnu et un mot de passe faux ; 403 (ADRESSE_NON_VERIFIEE, COMPTE_SUSPENDU, COMPTE_INACTIF) et 423 ne sont renvoyés qu’au titulaire du bon mot de passe.
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/Identifiants"
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
        "423":
          $ref: "#/components/responses/Erreur423"
        "429":
          $ref: "#/components/responses/Erreur429"
  "/auth/refresh":
    post:
      tags: [Authentification]
      summary: Renouveler la session à partir du cookie ; fait tourner le jeton et détecte sa réutilisation.
      operationId: postAuthRefresh
      security: []
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Erreur401"
  "/auth/logout":
    post:
      tags: [Authentification]
      summary: "Fermer la session : révoque le jeton de rafraîchissement et efface le cookie. Réussit même si le jeton d’accès a expiré."
      operationId: postAuthLogout
      security: []
      responses:
        "204":
          description: Opération réalisée, sans contenu.
  "/auth/forgot-password":
    post:
      tags: [Authentification]
      summary: Demander un lien de réinitialisation. Réponse identique que le compte existe ou non.
      operationId: postAuthForgotPassword
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/DemandeReinitialisation"
      responses:
        "204":
          description: Opération réalisée, sans contenu.
        "429":
          $ref: "#/components/responses/Erreur429"
  "/auth/reset-password":
    post:
      tags: [Authentification]
      summary: Choisir un nouveau mot de passe par le lien de réinitialisation ou d’invitation ; ferme toutes les sessions.
      operationId: postAuthResetPassword
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/Reinitialisation"
      responses:
        "204":
          description: Opération réalisée, sans contenu.
        "400":
          $ref: "#/components/responses/Erreur400"
  "/users/me":
    get:
      tags: [Compte]
      summary: Profil de l’utilisateur connecté.
      operationId: getUsersMe
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Profil"
        "401":
          $ref: "#/components/responses/Erreur401"
    put:
      tags: [Compte]
      summary: Modifier son profil.
      operationId: putUsersMe
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ProfilMiseAJour"
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Profil"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
  "/users/me/password":
    put:
      tags: [Compte]
      summary: "Changer son mot de passe ; lève l’indicateur de changement obligatoire, ferme les autres sessions et remplace le cookie de la session courante. Les jetons d’accès déjà émis sont refusés : renouveler la session (POST /auth/refresh)."
      operationId: putUsersMePassword
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ChangementMotDePasse"
      responses:
        "204":
          description: Opération réalisée, sans contenu.
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
  "/users/me/preferences":
    get:
      tags: [Compte]
      summary: Préférences de notification.
      operationId: getUsersMePreferences
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Erreur401"
    put:
      tags: [Compte]
      summary: Modifier ses préférences de notification.
      operationId: putUsersMePreferences
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
  "/users/me/export":
    get:
      tags: [Compte]
      summary: Copie des données personnelles du compte (droit d’accès).
      operationId: getUsersMeExport
      responses:
        "200":
          description: Fichier JSON à enregistrer.
          content:
            "application/json":
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Erreur401"
  "/users/me/suppression":
    post:
      tags: [Compte]
      summary: Supprimer son compte, après confirmation par le mot de passe. 409 pour le dernier Super Admin.
      operationId: postUsersMeSuppression
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SuppressionCompte"
      responses:
        "204":
          description: Opération réalisée, sans contenu.
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "409":
          $ref: "#/components/responses/Erreur409"
  "/pages/{slug}":
    get:
      tags: [Contenus publics]
      summary: Page d’information (accueil, présentation). 404 tant que le club ne l’a pas rédigée.
      operationId: getPagesSlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PageInformation"
        "404":
          $ref: "#/components/responses/Erreur404"
    put:
      tags: [Administration]
      summary: Rédiger ou modifier une page d’information (accueil, présentation).
      operationId: putPagesSlug
      x-roles: [ADMIN]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PageSaisie"
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PageInformation"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
        "404":
          $ref: "#/components/responses/Erreur404"
  "/bureau":
    get:
      tags: [Contenus publics]
      summary: Composition du bureau, par ordre d’affichage.
      operationId: getBureau
      security: []
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembreBureau"
    post:
      tags: [Gestion du club]
      summary: Ajouter un membre du bureau.
      operationId: postBureau
      x-roles: [RESPONSABLE_CLUB]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/MembreBureauSaisie"
      responses:
        "201":
          description: Ressource créée.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MembreBureau"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
  "/categories":
    get:
      tags: [Contenus publics]
      summary: Catégories.
      operationId: getCategories
      security: []
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categorie"
    post:
      tags: [Administration]
      summary: Créer une catégorie.
      operationId: postCategories
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CategorieSaisie"
      responses:
        "201":
          description: Ressource créée.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Categorie"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
        "409":
          $ref: "#/components/responses/Erreur409"
  "/actualites":
    get:
      tags: [Contenus publics]
      summary: Actualités publiées et publiques.
      operationId: getActualites
      security: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/categorieId"
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PageActualite"
        "400":
          $ref: "#/components/responses/Erreur400"
    post:
      tags: [Gestion du club]
      summary: Créer une actualité.
      operationId: postActualites
      x-roles: [RESPONSABLE_CLUB]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ActualiteSaisie"
      responses:
        "201":
          description: Ressource créée.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Actualite"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
  "/actualites/slug/{slug}":
    get:
      tags: [Contenus publics]
      summary: Actualité publiée.
      operationId: getActualitesSlugSlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Actualite"
        "404":
          $ref: "#/components/responses/Erreur404"
  "/evenements":
    get:
      tags: [Contenus publics]
      summary: Événements publiés.
      operationId: getEvenements
      security: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/categorieId"
        - name: aVenir
          in: query
          schema:
            type: boolean
          description: Ne retenir que les événements non terminés.
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PageEvenement"
        "400":
          $ref: "#/components/responses/Erreur400"
    post:
      tags: [Gestion du club]
      summary: Créer un événement.
      operationId: postEvenements
      x-roles: [RESPONSABLE_CLUB]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/EvenementSaisie"
      responses:
        "201":
          description: Ressource créée.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Evenement"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
  "/evenements/slug/{slug}":
    get:
      tags: [Contenus publics]
      summary: Événement publié.
      operationId: getEvenementsSlugSlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Evenement"
        "404":
          $ref: "#/components/responses/Erreur404"
  "/evenements/{id}/calendrier":
    get:
      tags: [Contenus publics]
      summary: Événement au format iCalendar (décision D-06).
      operationId: getEvenementsIdCalendrier
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Fichier iCalendar.
          content:
            "text/calendar":
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Erreur404"
  "/formations":
    get:
      tags: [Contenus publics]
      summary: Formations publiées.
      operationId: getFormations
      security: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/categorieId"
        - name: niveau
          in: query
          schema:
            $ref: "#/components/schemas/Niveau"
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PageFormation"
        "400":
          $ref: "#/components/responses/Erreur400"
    post:
      tags: [Formation]
      summary: Créer une formation.
      operationId: postFormations
      x-roles: [FORMATEUR]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/FormationSaisie"
      responses:
        "201":
          description: Ressource créée.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Formation"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
  "/formations/slug/{slug}":
    get:
      tags: [Contenus publics]
      summary: Formation publiée, avec ses séances.
      operationId: getFormationsSlugSlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Formation"
        "404":
          $ref: "#/components/responses/Erreur404"
  "/projets":
    get:
      tags: [Contenus publics]
      summary: Projets validés, en cours ou terminés.
      operationId: getProjets
      security: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/categorieId"
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PageProjet"
        "400":
          $ref: "#/components/responses/Erreur400"
    post:
      tags: [Espace Membre]
      summary: Proposer un projet (statut « proposé »).
      operationId: postProjets
      x-roles: [MEMBRE]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ProjetSaisie"
      responses:
        "201":
          description: Ressource créée.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Projet"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
  "/projets/slug/{slug}":
    get:
      tags: [Contenus publics]
      summary: Projet validé.
      operationId: getProjetsSlugSlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Projet"
        "404":
          $ref: "#/components/responses/Erreur404"
  "/ressources/publiques":
    get:
      tags: [Contenus publics]
      summary: Ressources publiques.
      operationId: getRessourcesPubliques
      security: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/search"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TypeRessource"
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PageRessource"
        "400":
          $ref: "#/components/responses/Erreur400"
  "/contact":
    post:
      tags: [Contenus publics]
      summary: Envoyer un message au club (enregistré, notifié par courriel, accusé de réception).
      operationId: postContact
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/MessageContactSaisie"
      responses:
        "204":
          description: Opération réalisée, sans contenu.
        "400":
          $ref: "#/components/responses/Erreur400"
        "429":
          $ref: "#/components/responses/Erreur429"
  "/inscriptions/me":
    get:
      tags: [Espace Membre]
      summary: Inscriptions de l’utilisateur.
      operationId: getInscriptionsMe
      x-roles: [MEMBRE]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
        - name: type
          in: query
          schema:
            type: string
            enum: [FORMATION, EVENEMENT]
        - name: statut
          in: query
          schema:
            $ref: "#/components/schemas/StatutInscription"
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PageInscription"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
  "/inscriptions/evenements/{evenementId}":
    post:
      tags: [Espace Membre]
      summary: "S’inscrire à un événement ; liste d’attente si la capacité est atteinte. 409 : déjà inscrit (DEJA_INSCRIT) ou inscriptions closes (INSCRIPTIONS_CLOSES)."
      operationId: postInscriptionsEvenementsEvenementId
      x-roles: [MEMBRE]
      parameters:
        - name: evenementId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "201":
          description: Ressource créée.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Inscription"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
        "404":
          $ref: "#/components/responses/Erreur404"
        "409":
          $ref: "#/components/responses/Erreur409"
    get:
      tags: [Gestion du club]
      summary: Inscrits d’un événement.
      operationId: getInscriptionsEvenementsEvenementId
      x-roles: [RESPONSABLE_CLUB]
      parameters:
        - name: evenementId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Succès.
          content:
            "application/json":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inscription"

components:
  securitySchemes:
    jetonAcces:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Numéro de page, à partir de zéro.
    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 10
      description: Taille de page.
    sort:
      name: sort
      in: query
      schema:
        type: string
      description: "Tri : « champ,asc » ou « champ,desc »."
    search:
      name: search
      in: query
      schema:
        type: string
      description: Recherche plein texte ; facultative.
    categorieId:
      name: categorieId
      in: query
      schema:
        type: integer
        format: int64
  responses:
    Erreur400:
      description: "Requête invalide : erreurs de champ dans « errors »."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Probleme"
    Erreur401:
      description: Session absente ou expirée, ou identifiants refusés.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Probleme"
    Erreur403:
      description: Droits insuffisants (rôle ou propriété de la ressource).
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Probleme"
    Erreur404:
      description: Ressource introuvable.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Probleme"
    Erreur409:
      description: Conflit avec l’état actuel des données.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Probleme"
    Erreur413:
      description: Fichier trop volumineux.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Probleme"
    Erreur415:
      description: Type de fichier refusé.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Probleme"
    Erreur423:
      description: Compte temporairement verrouillé après des échecs de connexion.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Probleme"
    Erreur429:
      description: "Trop de requêtes : limitation de débit."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Probleme"
  schemas:
    Probleme:
      type: object
      description: Erreur au format RFC 9457. Le champ « code » est stable ; « detail » est rédigé en français.
      required: [title, status, code]
      properties:
        type:
          type: [string, "null"]
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int64
        detail:
          type: [string, "null"]
        instance:
          type: [string, "null"]
        code:
          type: string
        errors:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ErreurChamp"
    ErreurChamp:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Identifiants:
      type: object
      description: "« seSouvenir » : le cookie de session survit à la fermeture du navigateur."
      required: [email, motDePasse]
      properties:
        email:
          type: string
          format: email
        motDePasse:
          type: string
        seSouvenir:
          type: [boolean, "null"]
    InscriptionCompte:
      type: object
      required: [nom, prenom, email, motDePasse, filiere, consentement]
      properties:
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
          format: email
        motDePasse:
          type: string
        filiere:
          type: string
        consentement:
          type: boolean
    JetonVerification:
      type: object
      required: [jeton]
      properties:
        jeton:
          type: string
    DemandeReinitialisation:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    Reinitialisation:
      type: object
      required: [token, nouveauMotDePasse]
      properties:
        token:
          type: string
        nouveauMotDePasse:
          type: string
    Session:
      type: object
      description: Le jeton de rafraîchissement voyage en cookie HttpOnly, jamais dans le corps.
      required: [accessToken, expiresIn, utilisateur]
      properties:
        accessToken:
          type: string

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clubinfo-postgres
    environment:
      POSTGRES_DB: clubinfo
      POSTGRES_USER: clubinfo
      POSTGRES_PASSWORD: clubinfo_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubinfo -d clubinfo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clubinfo-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clubinfo
      DB_USERNAME: clubinfo
      DB_PASSWORD: clubinfo_secret
      JWT_SECRET: ClubInformatiqueSuperSecretKeyForJWTTokenGeneration2026!
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clubinfo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

spring:
  application:
    name: club-informatique
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma est piloté exclusivement par Flyway
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never   # les messages passent par GlobalExceptionHandler, jamais la page d'erreur par défaut

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins: http://localhost:4200

springdoc:
  swagger-ui:
    path: /swagger-ui.html

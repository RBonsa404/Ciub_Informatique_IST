name: CI

# CI minimale (OUARE, semaine 1) : build + tests backend et frontend sur
# chaque Pull Request vers develop/main (section 4.2 du document de dispatch).
# À enrichir progressivement (lint, couverture, Playwright, ZAP, JMeter)
# au fil des phases du projet -- cf. 3.1.7 du cahier des charges.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: club_info
          POSTGRES_PASSWORD: club_info_test
          POSTGRES_DB: club_informatique_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U club_info -d club_informatique_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build + tests
        run: mvn -B verify
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://localhost:5432/club_informatique_test
          DB_USERNAME: club_info
          DB_PASSWORD: club_info_test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests unitaires
        run: npm test

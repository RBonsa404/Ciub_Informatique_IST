# En-têtes de sécurité, inclus dans chaque emplacement : Nginx n'hérite pas des « add_header »
# du niveau supérieur dès qu'un emplacement en déclare un.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Polices et scripts servis par le site lui-même ; styles en ligne nécessaires aux attributs « style » des gabarits ;
# images externes admises pour les illustrations d'actualité désignées par leur adresse.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

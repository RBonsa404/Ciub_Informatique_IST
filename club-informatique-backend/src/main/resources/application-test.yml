# ===================================================================
# Club Informatique IST — Profil TEST
# ===================================================================

spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///club_informatique_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    show-sql: false
    properties:
      hibernate:
        # Compte des requêtes SQL, pour les tests qui vérifient l'absence de requête par ligne.
        generate_statistics: true

  flyway:
    clean-disabled: false

  mail:
    host: localhost
    port: 1025

app:
  contact:
    destinataire: club@club.test
  mail:
    from: ne-pas-repondre@club.test
  storage:
    local:
      directory: target/depots-test
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs512-algorithm-testing-purposes-only
    access-token-expiration-ms: 60000
    refresh-token-expiration-ms: 120000

  security:
    bcrypt-strength: 4
    max-login-attempts: 3
    lock-duration-minutes: 1

logging:
  level:
    root: WARN
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: "OFF"
    acces: WARN
    com.clubinfo.ist: INFO

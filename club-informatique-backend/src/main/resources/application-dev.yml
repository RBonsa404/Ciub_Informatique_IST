# ===================================================================
# Club Informatique IST — Profil DEV
# ===================================================================

spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:club_informatique_dev}}}
    username: ${DB_USER:${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Logging
# Les requêtes SQL sont journalisées, jamais leurs paramètres (adresses, empreintes).
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requete:-}] %logger{30} : %msg%n"
  level:
    root: INFO
    com.clubinfo.ist: DEBUG
    org.hibernate.SQL: DEBUG

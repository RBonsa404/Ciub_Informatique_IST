# ===================================================================
# Club Informatique IST — Profil H2 (Zero-Config Test Local)
# ===================================================================

spring:
  datasource:
    url: jdbc:h2:mem:club_informatique_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.clubinfo.ist: DEBUG

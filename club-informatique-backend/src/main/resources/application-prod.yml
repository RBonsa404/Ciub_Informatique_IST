# ===================================================================
# Club Informatique IST — Profil PROD (Railway)
# ===================================================================
#
# Variables Railway à configurer dans le tableau de bord :
#   SPRING_DATASOURCE_URL  = jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}?sslmode=require
#   SPRING_DATASOURCE_USERNAME = ${{Postgres.PGUSER}}
#   SPRING_DATASOURCE_PASSWORD = ${{Postgres.PGPASSWORD}}
#   JWT_SECRET             = (chaîne aléatoire 64+ chars)
#   CORS_ALLOWED_ORIGINS   = https://<frontend>.up.railway.app

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:club_informatique}?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:${PGUSER:postgres}}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Petit conteneur, peu d'utilisateurs simultanés : dix connexions suffisent et ménagent la base.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      idle-timeout: 300000
      # Renouvelées avant que le proxy de l'hébergeur ne coupe une connexion inactive.
      max-lifetime: 1500000
      keepalive-time: 240000
      connection-timeout: 10000
      initialization-fail-timeout: -1

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    clean-disabled: true
    baseline-on-migrate: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  cookie:
    secure: true
  cors:
    # Obligatoire : origine exacte du frontend en ligne.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Journaux structurés (JSON, une ligne par événement) ; l'identifiant de requête y figure.
logging:
  structured:
    format:
      console: ecs
  level:
    root: WARN
    com.clubinfo.ist: INFO
    acces: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

# L'application est derrière le proxy de l'hébergeur : l'adresse du client et le schéma viennent des en-têtes transmis.
server:
  forward-headers-strategy: native

# La documentation interactive de l'API n'est pas exposée en production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

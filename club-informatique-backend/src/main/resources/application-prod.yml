# ===================================================================
# Club Informatique IST — Profil PROD (Railway)
# ===================================================================
#
# Variables Railway à configurer dans le tableau de bord :
#   SPRING_DATASOURCE_URL  = jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}?sslmode=require
#   SPRING_DATASOURCE_USERNAME = ${{Postgres.PGUSER}}
#   SPRING_DATASOURCE_PASSWORD = ${{Postgres.PGPASSWORD}}
#   JWT_SECRET             = (chaîne aléatoire 64+ chars)
#   CORS_ALLOWED_ORIGINS   = https://<frontend>.up.railway.app

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:club_informatique}?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:${PGUSER:postgres}}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      initialization-fail-timeout: -1

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    clean-disabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

# Logging — structured JSON, minimal
logging:
  level:
    root: WARN
    com.clubinfo.ist: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","logger":"%logger{36}","message":"%msg"}%n'


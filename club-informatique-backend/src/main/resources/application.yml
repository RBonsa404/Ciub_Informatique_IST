# ===================================================================
# Club Informatique IST — Configuration commune
# ===================================================================

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: club-informatique-backend

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # File upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# ===================================================================
# Application custom properties
# ===================================================================
app:
  jwt:
    secret: ${JWT_SECRET:changeThisSecretInProductionToAVeryLongAndSecureValue}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  rate-limit:
    auth:
      capacity: 5
      refill-tokens: 5
      refill-duration-minutes: 15
    password-reset:
      capacity: 3
      refill-tokens: 3
      refill-duration-minutes: 60

  security:
    bcrypt-strength: 12
    max-login-attempts: 5
    lock-duration-minutes: 30

  upload:
    directory: ${UPLOAD_DIR:./uploads}
    allowed-extensions: pdf,doc,docx,ppt,pptx,xls,xlsx,jpg,jpeg,png,gif,zip

# ===================================================================
# SpringDoc / Swagger
# ===================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ===================================================================
# Actuator — Healthcheck Railway
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

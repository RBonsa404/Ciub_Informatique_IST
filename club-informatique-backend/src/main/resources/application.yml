# ===================================================================
# Club Informatique de l'IST : configuration commune
# Tout secret vient de l'environnement ; aucune valeur sensible n'est écrite ici.
# ===================================================================

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/calendar
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: club-informatique-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 200
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    # Obligatoire en production (JWT_SECRET, 32 octets au moins). Absent ailleurs : clé aléatoire jusqu'au redémarrage.
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 jours
  cors:
    # Liste blanche d'origines exactes, séparées par des virgules.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rate-limit:
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:20}
      refill-duration-minutes: 15
    password-reset:
      capacity: 5
      refill-duration-minutes: 60
    contact:
      capacity: 5
      refill-duration-minutes: 60
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    max-login-attempts: 5
    lock-duration-minutes: 15
  upload:
    directory: ${UPLOAD_DIR:./uploads}
  bootstrap:
    # Premier Super Admin réel : créé au démarrage tant qu'aucun n'existe, mot de passe à changer à la première connexion.
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  test-accounts:
    # Comptes d'essai (un par rôle, domaine .invalid). Jamais activés par défaut.
    seed: ${APP_SEED_TEST_ACCOUNTS:false}
    password: ${APP_TEST_ACCOUNTS_PASSWORD:}
    # Retrait des comptes d'essai et de leurs données au démarrage.
    purge: ${APP_PURGE_TEST_ACCOUNTS:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false

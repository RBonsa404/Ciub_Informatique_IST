<div class="container fade-in">
  <a routerLink="/formations" class="back-link">&larr; Retour au catalogue</a>

  <div class="form-wrapper glass-panel">
    <h1>Créer une Formation</h1>
    <p class="subtitle">Remplissez les informations de la nouvelle formation</p>

    <div class="alert-error" *ngIf="errorMessage">
      ⚠️ {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="titre">Titre de la formation *</label>
        <input
          id="titre"
          type="text"
          formControlName="titre"
          placeholder="ex: Angular Avancé"
          [class.invalid]="form.get('titre')?.invalid && form.get('titre')?.touched"
        />
        <span class="error-hint" *ngIf="form.get('titre')?.invalid && form.get('titre')?.touched">
          Le titre doit faire au moins 3 caractères.
        </span>
      </div>

      <div class="form-group">
        <label for="description">Description *</label>
        <textarea
          id="description"
          formControlName="description"
          rows="4"
          placeholder="Décrivez le contenu, les objectifs, les prérequis..."
          [class.invalid]="form.get('description')?.invalid && form.get('description')?.touched"
        ></textarea>
        <span class="error-hint" *ngIf="form.get('description')?.invalid && form.get('description')?.touched">
          La description doit faire au moins 10 caractères.
        </span>
      </div>

      <div class="form-group">
        <label for="niveau">Niveau *</label>
        <select id="niveau" formControlName="niveau">
          <option *ngFor="let n of niveaux" [value]="n">{{ n }}</option>
        </select>
      </div>

      <div class="form-actions">
        <a routerLink="/formations" class="btn-secondary">Annuler</a>
        <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting">
          {{ isSubmitting ? 'Création en cours...' : '✓ Créer la formation' }}
        </button>
      </div>

    </form>
  </div>
</div>
